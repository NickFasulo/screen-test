<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Test</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #14181c;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
      }
      #root { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
      .brand { color: #c9a227; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
      h1 { font-size: 22px; margin-bottom: 4px; }
      .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
      .card { background: #1a2028; border: 1px solid #2a3442; border-radius: 12px; padding: 18px; margin-bottom: 14px; }
      .prompt { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
      .opt {
        display: block; width: 100%; text-align: left; cursor: pointer;
        background: #232b36; color: #e2e8f0; border: 1px solid #2f3a49;
        border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 8px;
        transition: border-color 0.15s, background 0.15s;
      }
      .opt:hover:not(:disabled) { border-color: #c9a227; background: #26303d; }
      .opt:disabled { cursor: default; opacity: 0.85; }
      .opt.correct { background: #1c3a2a; border-color: #38a169; }
      .opt.wrong { background: #3a1f22; border-color: #c53030; }
      .opt.dim { opacity: 0.5; }
      .meta { display: flex; justify-content: space-between; color: #94a3b8; font-size: 12px; margin-bottom: 14px; }
      .link { display: inline-block; margin-top: 10px; color: #c9a227; font-size: 13px; }
      .primary {
        background: #c9a227; color: #14181c; border: none; border-radius: 10px;
        padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%;
      }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .score-big { font-size: 34px; font-weight: 700; color: #c9a227; }
      .center { text-align: center; }
      .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #232b36; font-size: 14px; }
      .stage { position: relative; }
      .qcard { animation: qin 0.3s ease both; }
      .qcard.exit {
        position: absolute; top: 0; left: 0; right: 0;
        animation: qout 0.22s ease both;
      }
      @keyframes qin { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
      @keyframes qout { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-28px); } }
      .next { margin-top: 6px; }
      .footer { color: #64748b; font-size: 11px; text-align: center; margin-top: 8px; }
      .footer a { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
